<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard de Vendas - Dona Deola</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root {
    --primary: #FF6B35;
    --primary-soft: #FF8E53;
    --bg: #f4f6f8;
    --text: #333;
    --muted: #777;
    --card-radius: 14px;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
    background: var(--bg);
    color: var(--text);
    padding: 20px;
}

/* ====== CONTAINERS ====== */
.selection-container,
.dashboard {
    max-width: 1200px;
    margin: auto;
}

/* ====== CARD BASE ====== */
.card {
    background: #fff;
    border-radius: var(--card-radius);
    box-shadow: 0 10px 25px rgba(0,0,0,.08);
    padding: 30px;
    margin-bottom: 30px;
}

/* ====== INTRO ====== */
.company-intro {
    text-align: center;
}

.company-logo {
    max-width: 80px;
    margin-bottom: 15px;
}

.company-text {
    font-size: 0.95rem;
    color: var(--muted);
    line-height: 1.6;
}

/* ====== FORM ====== */
.selection-screen h2 {
    text-align: center;
    margin-bottom: 25px;
}

.form-group {
    margin-bottom: 18px;
}

label {
    font-size: 0.85rem;
    color: var(--muted);
}

.form-control {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #ccc;
    margin-top: 6px;
}

.btn-primary {
    width: 100%;
    padding: 14px;
    background: var(--primary);
    border: none;
    color: #fff;
    font-size: 1.05rem;
    border-radius: 8px;
    cursor: pointer;
    transition: .3s;
}

.btn-primary:hover {
    background: var(--primary-soft);
}

.btn-primary.loading {
    pointer-events: none;
    opacity: 0.8;
    position: relative;
}

.btn-primary.loading::after {
    content: '';
    width: 22px;
    height: 22px;
    border: 3px solid rgba(255,255,255,.4);
    border-top: 3px solid #fff;
    border-radius: 50%;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    animation: spin 1s linear infinite;
}

@keyframes spin {
    to { transform: rotate(360deg) translate(-50%, -50%); }
}

/* ====== DASHBOARD ====== */
.dashboard {
    display: none;
}

.back-btn {
    background: none;
    border: none;
    color: var(--primary);
    font-size: 1rem;
    cursor: pointer;
    margin-bottom: 15px;
}

.header {
    text-align: center;
    margin-bottom: 35px;
}

.header h1 {
    font-size: 2.2rem;
}

.header p {
    color: var(--muted);
}

/* ====== TOTAIS ====== */
.totals-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 20px;
    margin-bottom: 35px;
}

.total-box {
    background: #fff;
    border-radius: var(--card-radius);
    padding: 25px;
    text-align: center;
    box-shadow: 0 8px 20px rgba(0,0,0,.07);
    border-top: 5px solid var(--primary);
}

.total-value {
    font-size: 2.1rem;
    color: var(--primary);
    margin: 10px 0;
}

/* ====== CHARTS ====== */
.charts-container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
    gap: 30px;
}

.chart-card {
    background: #fff;
    border-radius: var(--card-radius);
    padding: 25px;
    box-shadow: 0 8px 20px rgba(0,0,0,.07);
}

.chart-card h3 {
    margin-bottom: 15px;
    font-size: 1.1rem;
}

.chart-wrapper {
    height: 340px;
}
</style>
</head>

<body>

<div class="selection-container">

    <div class="card company-intro">
        <img src="https://bakeryfood.com.br/Baker.gif" class="company-logo" />
        <p class="company-text">
            A <strong>Bakery Food</strong> é referência em soluções para panificação,
            confeitaria e food service, levando inovação e qualidade ao varejo alimentar.
        </p>
    </div>

    <div class="card selection-screen" id="selectionScreen">
        <h2>Selecionar Período</h2>

        <div class="form-group">
            <label>Unidade</label>
            <select id="unidade" class="form-control">
                <option value="">Selecione</option>
                <option>Lapa</option>
                <option>Granja Viana</option>
                <option>Einstein</option>
                <option>Saude</option>
                <option>Pompeia</option>
                <option>Higienopolis</option>
                <option>Alphaville</option>
                <option>Guarulhos</option>
            </select>
        </div>

        <div class="form-group">
            <label>Data Inicial</label>
            <input type="date" id="dataInicial" class="form-control" />
        </div>

        <div class="form-group">
            <label>Data Final</label>
            <input type="date" id="dataFinal" class="form-control" />
        </div>

        <button class="btn-primary" id="btnCarregar" onclick="carregarDashboard()">
            Carregar Dashboard
        </button>
    </div>

</div>

<div class="dashboard" id="dashboard">
    <button class="back-btn" onclick="voltar()">⬅ Voltar</button>

    <div class="header">
        <h1>Dona Deola</h1>
        <p id="periodoSelecionado"></p>
    </div>

    <div id="dashboardContent"></div>
</div>

<script>
const filiais = {
    "Lapa": "8urs76lF1QwjcNpi3CwD",
    "Granja Viana": "1743445467349",
    "Einstein": "1744827033140",
    "Saude": "1743443888148",
    "Pompeia": "1743026928977",
    "Higienopolis": "1743445823763",
    "Alphaville": "1764088658919",
    "Guarulhos": "1768504329886"
};

let vendasChart, pagamentoChart;

async function carregarDashboard() {
    const btn = document.getElementById('btnCarregar');
    const filialNome = unidade.value;
    const filialId = filiais[filialNome];
    const di = dataInicial.value;
    const df = dataFinal.value;

    if (!filialId || !di || !df) {
        alert('Preencha todos os campos');
        return;
    }

    try {
        btn.classList.add('loading');
        btn.innerText = 'Carregando...';

        const url = `https://webapi-uteis-ezf9f5gaaghcgzah.brazilsouth-01.azurewebsites.net/api/Vendas/ListarResumoVendasPorTipoPagamento?filialId=${filialId}&dtInicio=${di}&dtFim=${df}`;

        const res = await fetch(url);
        const dados = await res.json();

        criarDashboard(dados, filialNome, di, df);

        selectionScreen.style.display = 'none';
        dashboard.style.display = 'block';

    } catch (e) {
        alert('Erro ao carregar dashboard');
        console.error(e);
    } finally {
        btn.classList.remove('loading');
        btn.innerText = 'Carregar Dashboard';
    }
}

function criarDashboard(dados, filialNome, di, df) {
    periodoSelecionado.innerText = `Período: ${di} a ${df} | Unidade: ${filialNome}`;

    dashboardContent.innerHTML = `
        <div class="totals-grid">
            <div class="total-box">
                <div>Total Geral</div>
                <div class="total-value">R$ ${dados.resumoGeral.totalValor.toLocaleString('pt-BR',{minimumFractionDigits:2})}</div>
            </div>
            <div class="total-box">
                <div>Clientes</div>
                <div class="total-value">${dados.resumoGeral.totalRegistros}</div>
            </div>
            <div class="total-box">
                <div>Ticket Médio</div>
                <div class="total-value">R$ ${dados.resumoGeral.ticketMedio.toLocaleString('pt-BR',{minimumFractionDigits:2})}</div>
            </div>
        </div>

        <div class="charts-container">
            <div class="chart-card">
                <h3>Evolução das Vendas</h3>
                <div class="chart-wrapper"><canvas id="vendasChart"></canvas></div>
            </div>

            <div class="chart-card">
                <h3>Pagamento</h3>
                <div class="chart-wrapper"><canvas id="pagamentoChart"></canvas></div>
            </div>
            <div class="chart-card" style="grid-column: 1 / -1;">
                <h3>Horários de Maior Movimentação</h3>
                <canvas id="movimentoHoraChart"></canvas>
            </div>

        </div>
    `;

    criarGraficoVendas(dados.evolucaoDiaria);
    criarGraficoPagamento(dados.resumoPorPagamento);
    carregarGraficoMovimentoHora(filialId, di, df);
}


async function carregarGraficoMovimentoHora(filialId, di, df) {
    const url = `https://webapi-uteis-ezf9f5gaaghcgzah.brazilsouth-01.azurewebsites.net/api/Vendas/ResumoMovimentoPorHora?filialId=${filialId}&dtInicio=${di}&dtFim=${df}`;
    const dados = await fetch(url).then(r => r.json());

    const labels = dados.map(x => `${x.hora.toString().padStart(2,'0')}:00`);
    const valores = dados.map(x => x.totalRegistros);
    const pico = valores.indexOf(Math.max(...valores));

    if (movimentoHoraChart) movimentoHoraChart.destroy();

    movimentoHoraChart = new Chart(document.getElementById('movimentoHoraChart'), {
        type: 'line',
        data: {
            labels,
            datasets: [{
                data: valores,
                borderColor: '#FF6B35',
                backgroundColor: 'rgba(255,107,53,.2)',
                fill: true,
                tension: 0.4,
                pointRadius: valores.map((_, i) => i === pico ? 7 : 4)
            }]
        },
        options: {
            plugins: { legend: { display: false } },
            scales: { y: { beginAtZero: true } }
        }
    });
}

function criarGraficoVendas(dados) {
    if (vendasChart) vendasChart.destroy();

    vendasChart = new Chart(vendasChartEl = document.getElementById('vendasChart'), {
        type: 'bar',
        data: {
          labels: dados.map(x => {
                const d = new Date(x.data);
                return d.toLocaleDateString('pt-BR');
            }),
            datasets: [{
                data: dados.map(x => x.totalValor),
                backgroundColor: '#FF6B35'
            }]
        },
        options: {
            plugins: { legend: { display: false } },
            scales: {
                y: {
                    ticks: {
                        callback: v => 'R$ ' + v.toLocaleString('pt-BR')
                    }
                }
            }
        }
    });
}
function criarGraficoPagamento(resumo) {

    if (pagamentoChart) pagamentoChart.destroy();

    pagamentoChart = new Chart(document.getElementById('pagamentoChart'), {
        type: 'bar',
        data: {
            labels: resumo.map(x => x.tipoPagamento),
            datasets: [{
                data: resumo.map(x => x.totalValor),
                backgroundColor: '#FF8E53'
            }]
        },
        options: {
            plugins: {
                tooltip: {
                    callbacks: {
                        afterLabel: ctx => {
                            const item = resumo[ctx.dataIndex];
                            if (!item.bandeiras.length) return '';
                            return item.bandeiras.map(b =>
                                `${b.bandeira}: R$ ${b.totalValor.toLocaleString('pt-BR')}`
                            );
                        }
                    }
                },
                legend: { display: false }
            }
        }
    });
}


function voltar() {
    dashboard.style.display = 'none';
    selectionScreen.style.display = 'block';
}

window.onload = () => {
    const hoje = new Date().toISOString().split('T')[0];
    dataInicial.value = hoje;
    dataFinal.value = hoje;
};
</script>

</body>
</html>
